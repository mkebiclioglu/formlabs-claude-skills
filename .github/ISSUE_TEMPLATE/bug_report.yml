name: Bug report
description: A skill behaved incorrectly or got stuck
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Which skill, what prompt did you give it, what did it do?
    validations:
      required: true
  - type: textarea
    id: transcript
    attributes:
      label: Relevant transcript
      description: Paste the Claude Code chat (or the relevant slice). Redact anything sensitive.
      render: text
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Output of `/formlabs:setup`
      description: The check table it prints (plugin version, PreFormServer version, OS). Or paste `npx -y formlabs-local-mcp doctor`.
      render: text
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Claude Code version
      description: From `claude --version`.
      placeholder: "2.1.0"
    validations:
      required: true
